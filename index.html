<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple ID Card Interface</title>
<link rel="stylesheet" href="idcard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="navbar">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">Choose Photo 👤</button>
    <input type="file" id="bgInput" accept="image/*" hidden>
    <button type="button" class="bg-btn" onclick="document.getElementById('bgInput').click()">Change Background 🎨</button>
    <button type="button" class="margin-btn" onclick="movePhoto('up')">Photo Up ⬆️</button>
    <button type="button" class="margin-btn" onclick="movePhoto('down')">Photo Down ⬇️</button>
    <button type="button" class="edit-btn" onclick="changeCardHeadings()">Edit Headings 📝</button>
    <button type="button" class="print-table-btn" onclick="printTableArea()">Print Table 🖨️</button>
    <button type="button" id="savetabel" class="save-table-btn">Save Table 💾</button>
    <button type="button" class="save-btn" onclick="downloadJPG()">Save as JPG 🖼️</button>
    <button type="button" id="nextBtn" onclick="nextStudent()">Next ➡️</button>
</div>
<div class="workspace">
    <div class="card" id="cardContainer">
        <div class="photo" id="photocontainer"></div>
        <div class="details">
            <p><span id="lblName">छात्र/छात्रा का नाम :-</span><input type="text" id="cardName" placeholder="नाम लिखें"></p>
            <p><span id="lblClass">कक्षा :-</span><input type="text" id="cardClass" placeholder="कक्षा लिखें"></p>
            <p><span id="lblFather">पिता का नाम :-</span><input type="text" id="cardFather" placeholder="पिता का नाम लिखें"></p>
            <p><span id="lblMobile">मो० नं० :-</span><input type="text" id="cardMobile" placeholder="मोबाइल नंबर लिखें"></p>
            <p><span id="lblBlood">ब्लड ग्रुप :-</span><input type="text" id="cardBlood" placeholder="ब्लड ग्रुप लिखें"></p>
            <p><span id="lblAddress">पता :-</span><input type="text" id="cardAddress" placeholder="पता लिखें"></p>
            <p><input type="text" class="transparent" id="cardExtraAddress" placeholder="पता लिखें"></p>
        </div>
    </div>
    <div class="table-container">
        <table class="display-grid-table">
            <thead><tr>
                <th>Sr. No.</th><th id="thName">छात्र का नाम</th><th id="thClass">कक्षा</th>
                <th id="thFather">पिता का नाम</th><th id="thMobile">मो० नं०</th>
                <th id="thBlood">ब्लड ग्रुप</th><th id="thAddress">पता</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const SUPABASE_URL = "https://wthjxebvovhwwnvhdavm.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aGp4ZWJ2b3Zod3dudmhkYXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODU0NjIsImV4cCI6MjEwMzU2MTQ2Mn0.MabSdbcci02ZtpYQfJh3mZV8yhlxRiUWcth11iM4J6U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const fileInput = document.getElementById("fileInput");
    const bgInput = document.getElementById("bgInput");
    const photo = document.getElementById("photocontainer");
    const card = document.getElementById("cardContainer");
    const tableBody = document.getElementById("tableBody");
    const saveButton = document.getElementById("savetabel");
    let selectedPhotoFile = null;
    let currentStudentIndex = -1;
    let currentMargin = 10;

    const fields = ["cardName", "cardClass", "cardFather", "cardMobile", "cardBlood", "cardAddress", "cardExtraAddress"];
    const readCard = () => {
        const values = fields.map(id => document.getElementById(id).value.trim());
        return {
            Name: values[0],
            Class: values[1],
            "Father Name": values[2],
            "Mobile No": values[3],
            "Blood Group": values[4],
            Addresh: [values[5], values[6]].filter(Boolean).join(" ")
        };
    };

    function appendStudentRow(student) {
        const tr = document.createElement("tr");
        const cells = [tableBody.rows.length + 1, student.Name, student.Class, student["Father Name"], student["Mobile No"], student["Blood Group"], student.Addresh];
        cells.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "-";
            tr.appendChild(td);
        });
        tr.cells[0].classList.add("sr-click");
        tr.cells[0].addEventListener("click", () => {
            currentStudentIndex = Array.from(tableBody.rows).indexOf(tr);
            ["cardName", "cardClass", "cardFather", "cardMobile", "cardBlood", "cardAddress"].forEach((id, i) => {
                document.getElementById(id).value = tr.cells[i + 1].textContent === "-" ? "" : tr.cells[i + 1].textContent;
            });
            document.getElementById("cardExtraAddress").value = "";
            document.getElementById("cardName").focus();
        });
        tableBody.appendChild(tr);
    }

    async function loadDataFromSupabase() {
        try {
            const { data, error } = await supabase.from("idcardtabel").select("*");
            if (error) throw error;
            tableBody.replaceChildren();
            (data || []).forEach(appendStudentRow);
        } catch (error) {
            console.error("Supabase data load error:", error);
            alert("डेटा लोड नहीं हुआ: " + error.message);
        }
    }

    fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
            alert("कृपया image file चुनें।");
            fileInput.value = "";
            return;
        }
        selectedPhotoFile = file;
        const reader = new FileReader();
        reader.onload = event => {
            photo.style.backgroundImage = `url('${event.target.result}')`;
            photo.style.backgroundSize = "cover";
            photo.style.backgroundPosition = "center";
        };
        reader.readAsDataURL(file);
    });

    bgInput.addEventListener("change", () => {
        const file = bgInput.files && bgInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => card.style.backgroundImage = `url('${event.target.result}')`;
        reader.readAsDataURL(file);
    });

    async function uploadPhoto() {
        if (!selectedPhotoFile) return null;
        const extension = (selectedPhotoFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const filePath = `${Date.now()}-${crypto.randomUUID()}.${extension || "jpg"}`;
        const { error } = await supabase.storage.from("idbucket").upload(filePath, selectedPhotoFile, {
            cacheControl: "3600",
            contentType: selectedPhotoFile.type,
            upsert: false
        });
        if (error) throw error;
        const { data } = supabase.storage.from("idbucket").getPublicUrl(filePath);
        return data.publicUrl;
    }

    async function savedatasupa() {
        if (saveButton.disabled) return;
        saveButton.disabled = true;
        const originalLabel = saveButton.textContent;
        saveButton.textContent = "Saving...";
        let uploadedPhotoUrl = null;
        try {
            const student = readCard();
            if (!Object.values(student).some(value => value)) {
                alert("पहले Card में जानकारी भरें।");
                return;
            }
            uploadedPhotoUrl = await uploadPhoto();
            const record = uploadedPhotoUrl ? { ...student, photo_url: uploadedPhotoUrl } : student;
            let { error } = await supabase.from("idcardtabel").insert(record);

            // पुरानी table में photo_url column नहीं होने पर बाकी student data फिर भी save करें।
            if (error && uploadedPhotoUrl && /photo_url|column|schema cache/i.test(error.message || "")) {
                console.warn("idcardtabel में photo_url column नहीं मिला; बिना URL के insert retry किया जा रहा है.", error);
                ({ error } = await supabase.from("idcardtabel").insert(student));
                if (!error) alert("डेटा सेव हुआ और फोटो bucket में upload हुई। URL table में रखने के लिए idcardtabel में photo_url (text) column जोड़ें।");
            }
            if (error) throw error;

            appendStudentRow(student);
            clearCard();
            alert(uploadedPhotoUrl ? "✅ डेटा और फोटो सफलतापूर्वक सेव हुए!" : "✅ डेटा सेव हुआ!");
        } catch (error) {
            console.error("Save/upload error:", error);
            alert("❌ सेव नहीं हुआ: " + error.message + (uploadedPhotoUrl ? "\nफोटो bucket में upload हो चुकी है; दोबारा सेव करने पर duplicate photo बन सकती है।" : ""));
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = originalLabel;
        }
    }
    saveButton.addEventListener("click", savedatasupa);

    function clearCard() {
        fields.forEach(id => document.getElementById(id).value = "");
        selectedPhotoFile = null;
        fileInput.value = "";
        photo.style.backgroundImage = "none";
        currentStudentIndex = -1;
        document.getElementById("cardName").focus();
    }

    window.movePhoto = direction => {
        if (direction === "up") currentMargin -= 5;
        if (direction === "down") currentMargin += 5;
        photo.style.marginTop = `${currentMargin}px`;
    };

   window.nextStudent = function nextStudent() {
    const totalStudents = tableBody.rows.length;

    if (totalStudents === 0) {
        alert("❌ Table में अभी कोई student नहीं है!");
        return;
    }

    const nextIndex = currentStudentIndex + 1;

    // आखिरी record पर ही alert दें; index को आखिरी record पर ही रखें।
    if (nextIndex >= totalStudents) {
        alert("ℹ️ यह आखिरी student है। अगला record उपलब्ध नहीं है!");
        return;
    }

    currentStudentIndex = nextIndex;
    const row = tableBody.rows[currentStudentIndex];

    ["cardName", "cardClass", "cardFather", "cardMobile", "cardBlood", "cardAddress"]
        .forEach((id, i) => {
            const value = row.cells[i + 1].textContent;
            document.getElementById(id).value = value === "-" ? "" : value;
        });

    document.getElementById("cardExtraAddress").value = "";
};

    window.changeCardHeadings = () => {
        [["lblName", "thName"], ["lblClass", "thClass"], ["lblFather", "thFather"], ["lblMobile", "thMobile"], ["lblBlood", "thBlood"], ["lblAddress", "thAddress"]].forEach(([labelId, headerId], index) => {
            const label = document.getElementById(labelId);
            const updated = prompt(`${index + 1}. Heading बदलें:`, label.textContent);
            if (updated !== null) {
                label.textContent = updated;
                document.getElementById(headerId).textContent = updated.replace(" :-", "");
            }
        });
    };

    window.printTableArea = () => {
        if (!tableBody.rows.length) return alert("Table में कोई data नहीं है!");
        const printWindow = window.open("", "_blank");
        if (!printWindow) return alert("Print window नहीं खुली। Browser में pop-ups allow करें।");
        printWindow.document.write(document.querySelector(".table-container").outerHTML);
        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
    };

    window.downloadJPG = () => {
        if (typeof html2canvas === "undefined") return alert("html2canvas library load नहीं हुई!");
        html2canvas(card, { scale: 4, useCORS: true, backgroundColor: null })
            .then(canvas => {
                const link = document.createElement("a");
                link.download = "student-id-card.jpg";
                link.href = canvas.toDataURL("image/jpeg", 1);
                link.click();
            })
            .catch(error => {
                console.error("JPG export error:", error);
                alert("JPG save नहीं हो पाया।");
            });
    };

    loadDataFromSupabase();
});
</script>
</body>
</html>
